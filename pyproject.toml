[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labelmap"
version = "1.0.0"
description = "Interactive maps from spreadsheets with chart markers and draggable labels"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Pyae Phyo Kyaw", email = "pyaek@icloud.com" },
]
keywords = ["streamlit", "folium", "mapping", "visualization", "spreadsheet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Streamlit",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "streamlit>=1.33.0",
    "pandas>=2.0.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.18.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
export = [
    "playwright>=1.40.0",
]
dev = [
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/pyaek/label-map"
Repository = "https://github.com/pyaek/label-map"
Issues = "https://github.com/pyaek/label-map/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["labelmap*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"labelmap/ui.py" = ["E501"]
